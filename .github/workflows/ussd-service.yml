name: USSD service and unit tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.9.0"
      - name: Install existing USSD service dependencies
        run: npm ci
        working-directory: ussd-service
      - name: Run repository tests
        run: node --test
