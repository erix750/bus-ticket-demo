<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173f70">
    <title>Page not found | Wayline</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            color: #20364e;
            background: #f3f6fa;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
        }

        main {
            width: min(100%, 520px);
            padding: clamp(24px, 6vw, 44px);
            border: 1px solid #d7e1ed;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(23, 63, 112, 0.1);
        }

        .brand {
            margin: 0 0 28px;
            color: #173f70;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.12em;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #9a6a22;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(30px, 7vw, 42px);
            line-height: 1.15;
        }

        #message {
            margin: 14px 0 24px;
            color: #5d7084;
            line-height: 1.6;
        }

        .home-link {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            border-radius: 8px;
            color: #fff;
            background: #173f70;
            font-weight: 700;
            text-decoration: none;
        }

        .home-link:focus-visible {
            outline: 3px solid #9dc9f0;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <p class="brand">WAYLINE</p>
        <p class="eyebrow" id="status">404 · PAGE NOT FOUND</p>
        <h1 id="title">We couldn't find that page.</h1>
        <p id="message">The address may be incorrect or the page may have moved. Return to Wayline to continue.</p>
        <a class="home-link" id="homeLink" href="/bus-ticket-demo/">Go to Wayline</a>
    </main>
    <script>
        const homeUrl = new URL("/bus-ticket-demo/", window.location.origin);
        homeUrl.search = window.location.search;
        homeUrl.hash = window.location.hash;
        document.getElementById("homeLink").href = homeUrl.href;

        const query = new URLSearchParams(window.location.search);
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        if (query.get("error_code") === "otp_expired" || fragment.get("error_code") === "otp_expired") {
            document.getElementById("status").textContent = "EMAIL LINK EXPIRED";
            document.getElementById("title").textContent = "This email link has expired.";
            document.getElementById("message").textContent =
                "Email links can only be used once and may expire. Return to Wayline, request a fresh confirmation or password-reset email, and open the newest link.";
        }
    </script>
</body>
</html>
